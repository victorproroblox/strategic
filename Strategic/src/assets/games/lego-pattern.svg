<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <defs>
    <radialGradient id="stud-red" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FCA5A5" />
      <stop offset="100%" stop-color="#DC2626" />
    </radialGradient>
    <radialGradient id="stud-yellow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#EAB308" />
    </radialGradient>
    <radialGradient id="stud-blue" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BFDBFE" />
      <stop offset="100%" stop-color="#2563EB" />
    </radialGradient>
    <radialGradient id="stud-green" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#BBF7D0" />
      <stop offset="100%" stop-color="#16A34A" />
    </radialGradient>
    <radialGradient id="stud-orange" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#F97316" />
    </radialGradient>
  </defs>

  <!-- Cuadrícula de 4x4 "piezas" de 40x40, pensada para que el mosaico
       encaje sin costuras al repetirse (background-repeat) -->
  <g>
    <!-- Fila 1 -->
    <rect x="0"   y="0" width="40" height="40" fill="#DC2626" />
    <rect x="40"  y="0" width="40" height="40" fill="#EAB308" />
    <rect x="80"  y="0" width="40" height="40" fill="#2563EB" />
    <rect x="120" y="0" width="40" height="40" fill="#16A34A" />
    <!-- Fila 2 -->
    <rect x="0"   y="40" width="40" height="40" fill="#16A34A" />
    <rect x="40"  y="40" width="40" height="40" fill="#2563EB" />
    <rect x="80"  y="40" width="40" height="40" fill="#F97316" />
    <rect x="120" y="40" width="40" height="40" fill="#EAB308" />
    <!-- Fila 3 -->
    <rect x="0"   y="80" width="40" height="40" fill="#EAB308" />
    <rect x="40"  y="80" width="40" height="40" fill="#DC2626" />
    <rect x="80"  y="80" width="40" height="40" fill="#16A34A" />
    <rect x="120" y="80" width="40" height="40" fill="#2563EB" />
    <!-- Fila 4 -->
    <rect x="0"   y="120" width="40" height="40" fill="#2563EB" />
    <rect x="40"  y="120" width="40" height="40" fill="#F97316" />
    <rect x="80"  y="120" width="40" height="40" fill="#EAB308" />
    <rect x="120" y="120" width="40" height="40" fill="#DC2626" />
  </g>

  <!-- Líneas de separación sutiles entre piezas -->
  <g stroke="rgba(0,0,0,0.14)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="160" /><line x1="80" y1="0" x2="80" y2="160" /><line x1="120" y1="0" x2="120" y2="160" />
    <line x1="0" y1="40" x2="160" y2="40" /><line x1="0" y1="80" x2="160" y2="80" /><line x1="0" y1="120" x2="160" y2="120" />
  </g>

  <!-- Botones (studs) de cada pieza, 4 por pieza en cuadrícula 2x2 -->
  <g>
    <!-- Fila 1 -->
    <g>
      <circle cx="12" cy="12" r="6.5" fill="url(#stud-red)" /><circle cx="28" cy="12" r="6.5" fill="url(#stud-red)" />
      <circle cx="12" cy="28" r="6.5" fill="url(#stud-red)" /><circle cx="28" cy="28" r="6.5" fill="url(#stud-red)" />
    </g>
    <g>
      <circle cx="52" cy="12" r="6.5" fill="url(#stud-yellow)" /><circle cx="68" cy="12" r="6.5" fill="url(#stud-yellow)" />
      <circle cx="52" cy="28" r="6.5" fill="url(#stud-yellow)" /><circle cx="68" cy="28" r="6.5" fill="url(#stud-yellow)" />
    </g>
    <g>
      <circle cx="92" cy="12" r="6.5" fill="url(#stud-blue)" /><circle cx="108" cy="12" r="6.5" fill="url(#stud-blue)" />
      <circle cx="92" cy="28" r="6.5" fill="url(#stud-blue)" /><circle cx="108" cy="28" r="6.5" fill="url(#stud-blue)" />
    </g>
    <g>
      <circle cx="132" cy="12" r="6.5" fill="url(#stud-green)" /><circle cx="148" cy="12" r="6.5" fill="url(#stud-green)" />
      <circle cx="132" cy="28" r="6.5" fill="url(#stud-green)" /><circle cx="148" cy="28" r="6.5" fill="url(#stud-green)" />
    </g>
    <!-- Fila 2 -->
    <g>
      <circle cx="12" cy="52" r="6.5" fill="url(#stud-green)" /><circle cx="28" cy="52" r="6.5" fill="url(#stud-green)" />
      <circle cx="12" cy="68" r="6.5" fill="url(#stud-green)" /><circle cx="28" cy="68" r="6.5" fill="url(#stud-green)" />
    </g>
    <g>
      <circle cx="52" cy="52" r="6.5" fill="url(#stud-blue)" /><circle cx="68" cy="52" r="6.5" fill="url(#stud-blue)" />
      <circle cx="52" cy="68" r="6.5" fill="url(#stud-blue)" /><circle cx="68" cy="68" r="6.5" fill="url(#stud-blue)" />
    </g>
    <g>
      <circle cx="92" cy="52" r="6.5" fill="url(#stud-orange)" /><circle cx="108" cy="52" r="6.5" fill="url(#stud-orange)" />
      <circle cx="92" cy="68" r="6.5" fill="url(#stud-orange)" /><circle cx="108" cy="68" r="6.5" fill="url(#stud-orange)" />
    </g>
    <g>
      <circle cx="132" cy="52" r="6.5" fill="url(#stud-yellow)" /><circle cx="148" cy="52" r="6.5" fill="url(#stud-yellow)" />
      <circle cx="132" cy="68" r="6.5" fill="url(#stud-yellow)" /><circle cx="148" cy="68" r="6.5" fill="url(#stud-yellow)" />
    </g>
    <!-- Fila 3 -->
    <g>
      <circle cx="12" cy="92" r="6.5" fill="url(#stud-yellow)" /><circle cx="28" cy="92" r="6.5" fill="url(#stud-yellow)" />
      <circle cx="12" cy="108" r="6.5" fill="url(#stud-yellow)" /><circle cx="28" cy="108" r="6.5" fill="url(#stud-yellow)" />
    </g>
    <g>
      <circle cx="52" cy="92" r="6.5" fill="url(#stud-red)" /><circle cx="68" cy="92" r="6.5" fill="url(#stud-red)" />
      <circle cx="52" cy="108" r="6.5" fill="url(#stud-red)" /><circle cx="68" cy="108" r="6.5" fill="url(#stud-red)" />
    </g>
    <g>
      <circle cx="92" cy="92" r="6.5" fill="url(#stud-green)" /><circle cx="108" cy="92" r="6.5" fill="url(#stud-green)" />
      <circle cx="92" cy="108" r="6.5" fill="url(#stud-green)" /><circle cx="108" cy="108" r="6.5" fill="url(#stud-green)" />
    </g>
    <g>
      <circle cx="132" cy="92" r="6.5" fill="url(#stud-blue)" /><circle cx="148" cy="92" r="6.5" fill="url(#stud-blue)" />
      <circle cx="132" cy="108" r="6.5" fill="url(#stud-blue)" /><circle cx="148" cy="108" r="6.5" fill="url(#stud-blue)" />
    </g>
    <!-- Fila 4 -->
    <g>
      <circle cx="12" cy="132" r="6.5" fill="url(#stud-blue)" /><circle cx="28" cy="132" r="6.5" fill="url(#stud-blue)" />
      <circle cx="12" cy="148" r="6.5" fill="url(#stud-blue)" /><circle cx="28" cy="148" r="6.5" fill="url(#stud-blue)" />
    </g>
    <g>
      <circle cx="52" cy="132" r="6.5" fill="url(#stud-orange)" /><circle cx="68" cy="132" r="6.5" fill="url(#stud-orange)" />
      <circle cx="52" cy="148" r="6.5" fill="url(#stud-orange)" /><circle cx="68" cy="148" r="6.5" fill="url(#stud-orange)" />
    </g>
    <g>
      <circle cx="92" cy="132" r="6.5" fill="url(#stud-yellow)" /><circle cx="108" cy="132" r="6.5" fill="url(#stud-yellow)" />
      <circle cx="92" cy="148" r="6.5" fill="url(#stud-yellow)" /><circle cx="108" cy="148" r="6.5" fill="url(#stud-yellow)" />
    </g>
    <g>
      <circle cx="132" cy="132" r="6.5" fill="url(#stud-red)" /><circle cx="148" cy="132" r="6.5" fill="url(#stud-red)" />
      <circle cx="132" cy="148" r="6.5" fill="url(#stud-red)" /><circle cx="148" cy="148" r="6.5" fill="url(#stud-red)" />
    </g>
  </g>
</svg>
